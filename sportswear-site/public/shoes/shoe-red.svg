  <!-- brand pull tab -->
  <rect x="466" y="120" width="40" height="22" rx="8" fill="#1a0608"/>
  <text x="486" y="136" font-family="Archivo, sans-serif" font-size="11" font-weight="800" fill="#ff6a5e" text-anchor="middle">S</text>
