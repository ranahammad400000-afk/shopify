<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="trail running shoe">
  <defs>
    <linearGradient id="up1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b30"/>
      <stop offset="1" stop-color="#1a0608"/>
    </linearGradient>
    <linearGradient id="mid1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2e33"/>
      <stop offset="1" stop-color="#0c0d10"/>
    </linearGradient>
    <radialGradient id="sh1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgba(0,0,0,0.55)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <ellipse cx="320" cy="410" rx="250" ry="22" fill="url(#sh1)"/>

  <!-- outsole -->
  <path d="M58 360 Q60 330 110 326 L560 322 Q598 322 600 350 L600 372 Q600 392 575 392 L92 392 Q58 392 58 360 Z" fill="#0a0a0c"/>
  <rect x="70" y="372" width="18" height="20" rx="4" fill="#0a0a0c"/><rect x="101" y="372" width="18" height="20" rx="4" fill="#0a0a0c"/><rect x="132" y="372" width="18" height="20" rx="4" fill="#0a0a0c"/><rect x="163" y="372" width="18" height="20" rx="4" fill="#0a0a0c"/><rect x="194" y="372" width="18" height="20" rx="4" fill="#0a0a0c"/><rect x="225" y="372" width="18" height="20" rx="4" fill="#0a0a0c"/><rect x="256" y="372" width="18" height="20" rx="4" fill="#0a0a0c"/><rect x="287" y="372" width="18" height="20" rx="4" fill="#0a0a0c"/><rect x="318" y="372" width="18" height="20" rx="4" fill="#0a0a0c"/><rect x="349" y="372" width="18" height="20" rx="4" fill="#0a0a0c"/><rect x="380" y="372" width="18" height="20" rx="4" fill="#0a0a0c"/><rect x="411" y="372" width="18" height="20" rx="4" fill="#0a0a0c"/><rect x="442" y="372" width="18" height="20" rx="4" fill="#0a0a0c"/><rect x="473" y="372" width="18" height="20" rx="4" fill="#0a0a0c"/><rect x="504" y="372" width="18" height="20" rx="4" fill="#0a0a0c"/><rect x="535" y="372" width="18" height="20" rx="4" fill="#0a0a0c"/><rect x="566" y="372" width="18" height="20" rx="4" fill="#0a0a0c"/>

  <!-- midsole -->
  <path d="M60 350 Q70 300 150 296 L548 300 Q596 304 596 348 L596 360 Q470 372 300 370 Q150 368 60 360 Z" fill="url(#mid1)"/>
  <path d="M300 312 Q450 308 590 330" stroke="#ff6a5e" stroke-width="6" fill="none" opacity="0.85"/>

  <!-- upper body -->
  <path d="M96 300 Q90 200 150 150 Q210 100 300 104 Q360 106 410 150 L470 250 Q540 260 560 300 Q470 318 300 316 Q170 314 96 300 Z" fill="url(#up1)"/>

  <!-- toe cap -->
