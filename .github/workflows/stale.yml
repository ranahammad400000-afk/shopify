name: Stale Bot

# Keeps the backlog honest: anything with no activity for 30 days gets a polite
# "still relevant?" nudge, and is closed 7 days later if it stays quiet.
# Items labeled pinned / security / roadmap are never touched.

on:
  schedule:
    - cron: '30 1 * * *'   # daily at 01:30 UTC
  workflow_dispatch:        # lets you run it on demand from the Actions tab

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'pinned,security,roadmap'
          exempt-pr-labels: 'pinned,security,dependencies'
          operations-per-run: 60
          stale-issue-message: >
            This issue has been automatically marked as **stale** because it has
            had no activity for 30 days. It will be closed in 7 days if nothing
            further happens. Just leave a comment to keep it open — thanks!
          stale-pr-message: >
            This pull request has been automatically marked as **stale** after 30
            days of inactivity. It will be closed in 7 days if nothing further
            happens. Push a commit or comment to keep it open.
          close-issue-message: >
            Closing this issue after 37 days of inactivity. Feel free to reopen
            if it's still relevant — no hard feelings.
          close-pr-message: >
            Closing this pull request after 37 days of inactivity. Reopen it
            whenever you're ready to pick it back up.
